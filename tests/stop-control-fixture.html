<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Codex Stop Scanner Fixture</title>
  <style>
    body { font: 16px system-ui; margin: 24px; }
    ._ComposerLayoutRoot_kbwao_2 { border: 1px solid #777; padding: 16px; }
    ._ComposerLayoutFooter_kbwao_2 { display: flex; justify-content: flex-end; }
    button { min-height: 40px; min-width: 40px; }
  </style>
</head>
<body>
  <button id="trace-stop" aria-label="Stop">Unrelated stop control</button>
  <div class="_ComposerLayoutRoot_kbwao_2" role="presentation" data-composer-layout="multiline">
    <div class="_ComposerLayoutFooter_kbwao_2" data-composer-layout="multiline">
      <div class="flex min-w-0 items-center justify-end">
        <div class="flex shrink-0 items-center gap-2">
          <div class="flex items-center">
            <button
              id="composer-action"
              class="cursor-interaction size-token-button-composer bg-composer-primary rounded-full"
              aria-description="composer-stop"
              title="composer-stop"
              type="button">Stop</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p id="status" role="status" aria-label="waiting">waiting</p>
  <script>
    const language = new URLSearchParams(location.search).get("lang") || "en";
    const labels = {
      en: "Stop",
      cs: "Zastavit",
      de: "Stoppen",
      fr: "Arrêter",
      zh: "停止",
      structural: "Untranslated test label",
    };
    const action = document.getElementById("composer-action");
    action.setAttribute("aria-label", labels[language]);
    action.textContent = labels[language];
    if (language === "structural") {
      action.id = "composer-stop-button-stop-button";
    }
    action.addEventListener("click", () => {
      const status = document.getElementById("status");
      status.textContent = "stopped";
      status.setAttribute("aria-label", "stopped");
    });
    document.title = `Codex Stop Scanner Fixture - ${language}`;
  </script>
</body>
</html>
